name: 資料 · 台股處置股

# 資料集 disposition：pipeline/disposition/update.py → data 分支的 disposition/
on:
  schedule:
    # GitHub 排程使用 UTC 時間(台北 = UTC+8)
    # 避開整點(GitHub 整點排程常延遲好幾個小時)；Yahoo 的台股當日股價有時晚到，隔天早上再補抓一次
    - cron: '23 11 * * 1-5'   # 台北 週一~週五 19:23(證交所、櫃買中心公告當日處置股之後)
    - cron: '43 22 * * 0-4'   # 台北 週一~週五 06:43 (= UTC 前一日 22:43)，補抓前一日股價
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/_dataset.yml
    with:
      dataset: disposition
