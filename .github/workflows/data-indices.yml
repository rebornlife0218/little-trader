name: 資料 · 指數

# 資料集 indices：pipeline/indices/update.py → data 分支的 indices/
on:
  schedule:
    # GitHub 排程使用 UTC 時間(台北 = UTC+8)
    - cron: '30 7 * * 1-5'    # 台北 週一~週五 15:30
    - cron: '30 21 * * 1-5'   # 台北 週二~週六 05:30(= UTC 前一日 21:30；美股、歐股週一~五收盤後)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/_dataset.yml
    with:
      dataset: indices
    secrets: inherit   # Cloudflare Pages 部署用
