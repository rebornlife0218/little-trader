name: 本機排程檢查

# 本機排程(pipeline/run_local.py)產生的資料：電腦沒開或排程出錯時會默默停更，這裡每天檢查一次(scripts/check-freshness.mjs)，
# 太久沒更新就讓這個 workflow 失敗 → GitHub 寄信通知(帳號 Settings › Notifications › Actions 要開「失敗時通知」)
on:
  schedule:
    - cron: '0 6 * * 2-6'   # 台北時間週二~六 14:00(本機排程週一~五 23:45、週二~六 12:15 之後)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci   # wrangler：查股票查詢的 D1

      - name: 取出 data 分支
        run: |
          mkdir -p _data
          git fetch -q --depth=1 origin data
          git archive FETCH_HEAD | tar -x -C _data

      - name: 檢查本機資料集與股票查詢的更新時間
        run: node scripts/check-freshness.mjs _data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
