name: 資料 · 0050 vs 勞退基金

# 資料集 etf_compare：pipeline/etf_compare/update.py → data 分支的 etf_compare/
on:
  schedule:
    # GitHub 排程使用 UTC 時間(台北 = UTC+8)
    - cron: '0 1 * * 1-5'     # 台北 週一~週五 09:00(勞退基金每月初公告；0050 用月底收盤)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/_dataset.yml
    with:
      dataset: etf_compare
