name: 資料 · 0050 vs 勞退基金

# 資料集 etf_compare：已改由本機 pipeline/run_local.py 更新(台股 ETF 股價來自本機資料庫，GitHub Actions 連不到)
# 不再排程；手動執行會因為連不到資料庫而失敗
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/_dataset.yml
    with:
      dataset: etf_compare
    secrets: inherit   # Cloudflare Pages 部署用
