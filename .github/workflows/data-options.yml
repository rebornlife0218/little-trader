name: 資料 · 選擇權

# 資料集 options：pipeline/options/update.py → data 分支的 options/
on:
  schedule:
    # GitHub 排程使用 UTC 時間(台北 = UTC+8)
    - cron: '0 8 * * 1-5'     # 台北 週一~週五 16:00(期交所約 15:00 後公布當日行情)
    - cron: '0 22 * * 0-4'    # 台北 週一~週五 06:00(補抓前一日盤後)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    uses: ./.github/workflows/_dataset.yml
    with:
      dataset: options
