name: 部署網站

# 網站程式(main 的 web/) + 最新資料(data 分支) → Cloudflare Pages(完整版＋functions/ 後端：登入、會員權限、股價查詢)
#                                               → GitHub Pages(備援，公開版：沒有後端，拿掉會員限定的程式與資料)
# 觸發：程式更新(push)、手動、或各資料集更新完成後呼叫；自動測試(npm test)沒過就不部署
# Cloudflare Pages 需要 repo secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID(沒設定時只部署 GitHub Pages)；
# 專案名稱用 repo variable CLOUDFLARE_PROJECT，未設定時為 little-trader，第一次部署會自動建立專案
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 自動測試(tests/)：每個頁面註冊得起來、權限設定一致、部署流程跑得完、後端的權限與來源檢查
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 自動測試
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # 一律用 main 的最新程式：資料集更新是在較早的 commit 觸發的，若用觸發當下的版本，
      # 部署完成時可能把期間推送的新程式蓋回舊版
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 組合網站檔案
        run: |
          mkdir -p _site
          cp -r web/. _site/
          rm -rf _site/data && mkdir -p _site/data
          if git fetch -q --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C _site/data
          else
            echo "::warning::data 分支尚未建立，網站暫時沒有資料"
          fi
          ls -R _site/data | head -40

      # GitHub Pages 的網址(放在 /little-trader/ 子目錄)
      - uses: actions/configure-pages@v5
        id: pages

      # _site/_routes.json(哪些路徑經過 functions)、各頁面的 HTML 與 sitemap、GitHub Pages 用的公開版 _site_public(依 functions/_lib/access.json)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 產生路由設定、各頁面的 HTML 與公開版
        run: node scripts/build-site.mjs _site _site_public "${{ steps.pages.outputs.base_path }}/"

      # GitHub Pages 用的封裝(公開版)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_public

      # Cloudflare Pages 用的完整版
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1

  github-pages:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'little-trader' }}
    steps:
      - name: 檢查 Cloudflare 設定
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過 Cloudflare Pages"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # functions/、wrangler.toml、package.json 在 repo 裡
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          ref: main

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.skip != 'true'
        with:
          name: site
          path: _site

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm

      - name: 安裝 wrangler 與 functions 用的套件
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: 部署到 Cloudflare Pages
        if: steps.check.outputs.skip != 'true'
        run: |
          # 專案不存在就先建立(只有第一次)
          if ! npx wrangler pages project list | grep -qw "$PROJECT"; then
            npx wrangler pages project create "$PROJECT" --production-branch=main
          fi
          # 在 repo 根目錄執行：一起上傳 functions/，綁定 wrangler.toml 的 D1 與變數(密碼類用 wrangler pages secret 另外設定)
          npx wrangler pages deploy _site --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="$GITHUB_WORKFLOW #$GITHUB_RUN_NUMBER" --commit-dirty=true
