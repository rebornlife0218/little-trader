name: 部署網站

# 網站程式(main) + 最新資料(data 分支) → GitHub Pages
# 觸發：程式更新(push)、手動、或各資料集更新完成後呼叫
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 組合網站檔案
        run: |
          mkdir -p _site/data
          cp -r index.html assets modules content _site/
          if git fetch -q --depth=1 origin data; then
            git archive FETCH_HEAD | tar -x -C _site/data
          else
            echo "::warning::data 分支尚未建立，網站暫時沒有資料"
          fi
          ls -R _site/data | head -40

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
